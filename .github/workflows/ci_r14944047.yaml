name: CI - r14944047

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read
  checks: write

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Prettier check
        run: npm run format:check

      - name: Test
        run: npm test -- --reporter=json --outputFile=test-results.json --reporter=junit --outputFile=test-results.xml
        continue-on-error: true

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Test Results
          path: 'test-results.xml'
          reporter: 'java-junit'

      - name: Check test results and fail if needed
        run: |
          if [ ! -f test-results.json ]; then
            echo "Test results file not found"
            exit 1
          fi
          
          FAILED_TESTS=$(jq '.numFailedTests // 0' test-results.json)
          FAILED_SUITES=$(jq '.numFailedTestSuites // 0' test-results.json)
          
          if [ "$FAILED_TESTS" -gt 0 ] || [ "$FAILED_SUITES" -gt 0 ]; then
            echo "❌ Tests failed! Failed tests: $FAILED_TESTS, Failed suites: $FAILED_SUITES"
            exit 1
          fi
          
          echo "✅ All tests passed!"
